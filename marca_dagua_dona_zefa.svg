<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .gold { fill: #D4A359; }
      .goldline { stroke: #D4A359; fill: none; }
      .disc { fill: #1E1510; }
      .title { font-family: 'Lora', 'DejaVu Serif', serif; }
    </style>
    <path id="leaf" d="M 0,-13 C 4.5,-8.5 4.5,-3.5 0,0 C -4.5,-3.5 -4.5,-8.5 0,-13 Z" class="gold"/>
  </defs>

  <!-- outer light contour for legibility over warm/dark footage -->
  <circle cx="200" cy="200" r="197" stroke="#FAF6F0" fill="none" stroke-width="2.5" opacity="0.55"/>

  <!-- outer thin ring -->
  <circle cx="200" cy="200" r="195" class="goldline" stroke-width="1.5" opacity="0.9"/>

  <!-- dark disc -->
  <circle cx="200" cy="200" r="184" class="disc"/>

  <!-- inner thick ring -->
  <circle cx="200" cy="200" r="184" class="goldline" stroke-width="4"/>
  <circle cx="200" cy="200" r="172" class="goldline" stroke-width="1" opacity="0.7"/>

  <!-- left laurel sprig: curved stem + rounded leaves -->
  <g>
    <path d="M 103 208 C 111 183, 122 152, 146 123" class="goldline" stroke-width="2" stroke-linecap="round"/>
    <use href="#leaf" transform="translate(107,197) rotate(-58)"/>
    <use href="#leaf" transform="translate(116,180) rotate(-35)"/>
    <use href="#leaf" transform="translate(122,163) rotate(-62)"/>
    <use href="#leaf" transform="translate(131,146) rotate(-38)"/>
    <use href="#leaf" transform="translate(139,130) rotate(-60)"/>
    <use href="#leaf" transform="translate(147,120) rotate(-20) scale(0.85)"/>
  </g>
  <!-- right laurel sprig (mirrored) -->
  <g transform="translate(400,0) scale(-1,1)">
    <path d="M 103 208 C 111 183, 122 152, 146 123" class="goldline" stroke-width="2" stroke-linecap="round"/>
    <use href="#leaf" transform="translate(107,197) rotate(-58)"/>
    <use href="#leaf" transform="translate(116,180) rotate(-35)"/>
    <use href="#leaf" transform="translate(122,163) rotate(-62)"/>
    <use href="#leaf" transform="translate(131,146) rotate(-38)"/>
    <use href="#leaf" transform="translate(139,130) rotate(-60)"/>
    <use href="#leaf" transform="translate(147,120) rotate(-20) scale(0.85)"/>
  </g>

  <!-- heart with rays (echoing the sunburst-heart motif), enlarged for contrast -->
  <g transform="translate(200,108) scale(1.35)">
    <g class="goldline" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-32" x2="0" y2="-23"/>
      <line x1="23" y1="-23" x2="17" y2="-16"/>
      <line x1="-23" y1="-23" x2="-17" y2="-16"/>
      <line x1="31" y1="0" x2="22" y2="0"/>
      <line x1="-31" y1="0" x2="-22" y2="0"/>
    </g>
    <path d="M 0 16 C -14 4, -14 -10, -4 -12 C 2 -13, 0 -6, 0 -6 C 0 -6, -2 -13, 4 -12 C 14 -10, 14 4, 0 16 Z"
          class="gold"/>
  </g>

  <!-- text: DONA -->
  <text x="200" y="192" text-anchor="middle" class="title gold"
        font-size="26" letter-spacing="7" font-weight="600">DONA</text>

  <!-- text: ZEFA -->
  <text x="200" y="248" text-anchor="middle" class="title gold"
        font-size="56" letter-spacing="6" font-weight="700">ZEFA</text>

  <!-- small rule under name -->
  <g transform="translate(200,268)">
    <line x1="-46" y1="0" x2="-14" y2="0" class="goldline" stroke-width="1.4"/>
    <line x1="46" y1="0" x2="14" y2="0" class="goldline" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="3" class="gold"/>
  </g>
</svg>
